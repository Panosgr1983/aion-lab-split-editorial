<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ΑΓΡΙΤΗ ΝΙΚΟΛΙΑ MSc — Ψυχολόγος</title>
<meta name="description" content="ΑΓΡΙΤΗ ΝΙΚΟΛΙΑ MSc, Ψυχολόγος, undefined.">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#0f1724;--paper:#f8fafc;--accent:#0e7490}
body{background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;font-weight:300;line-height:1.6}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.left{padding:clamp(40px,7vw,100px);display:flex;flex-direction:column;justify-content:space-between}
.brand{font-family:'Instrument Serif',serif;font-size:1.5rem;letter-spacing:-.02em}
.brand i{display:block;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;font-style:normal;font-family:'Work Sans';margin-top:6px;opacity:.5}
.hero-copy h1{font-family:'Instrument Serif',serif;font-size:clamp(3rem,6.5vw,6rem);line-height:.94;letter-spacing:-.03em;font-weight:400}
.hero-copy h1 em{font-style:italic;color:var(--accent)}
.hero-copy p{margin-top:28px;max-width:38ch;font-size:1.05rem;color:color-mix(in srgb,var(--ink) 70%,transparent)}
.links{display:flex;gap:32px;margin-top:40px;font-size:.85rem;letter-spacing:.05em}
.links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:3px}
.right{background:var(--ink);position:relative;overflow:hidden}
.right img{width:100%;height:100%;object-fit:cover;opacity:.85;filter:saturate(.7)}
.nav-top{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:auto;opacity:.6}
</style></head><body>
<div class="split">
  <div class="left">
    <div class="nav-top"><span>01</span><span>Γαλάτσι</span></div>
    <div class="hero-copy">
      <h1>ΑΓΡΙΤΗ<br>ΝΙΚΟΛΙΑ<br><em>ακούει.</em></h1>
      <p>Ένας χώρος όπου μπορείς να μιλήσεις χωρίς να εξηγείς. Χωρίς διάγνωση πριν την ιστορία.</p>
      <div class="links"><a href="#ep">Επικοινωνία</a><a href="#info">Πληροφορίες</a></div>
    </div>
    <div class="brand">ΑΓΡΙΤΗ ΝΙΚΟΛΙΑ MSc<i>Ψυχολόγος</i></div>
  </div>
  <div class="right"><img src="img/health-1.jpg" alt=""></div>
</div>
</body></html>
